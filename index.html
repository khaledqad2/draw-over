<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawOver Test</title>
  </head>

  <body>
    <h4 id="tracer">USE DRAW OVER TOOLS TO DRAW YOUR COMMENTS</h4>
    <button id="activate">Activate Drawing</button>
    <button id="deactivate">Deactivate</button>
    <button id="clear">Clear All</button>

    <button id="line">Line Tool</button>
    <button id="arrow">Arrow Tool</button>
    <button id="rectangle">Rectangle Tool</button>

    <script type="module">
      import DrawOver from './src/index.ts';

      const drawer = new DrawOver({

        strokeWidth: 3
      });

      document.getElementById('activate').addEventListener('click', () => {
        drawer.activate();
        drawer.setTool('line');
      });

      document.getElementById('deactivate').addEventListener('click', () => {
        drawer.deactivate();
      });

      document.getElementById('clear').addEventListener('click', () => {
        drawer.clear();
      });
      document.getElementById('line').addEventListener('click', () => {
        drawer.setTool('line');
      });

      document.getElementById('arrow').addEventListener('click', () => {
        drawer.setTool('arrow');
      });

      document.getElementById('rectangle').addEventListener('click', () => {
        drawer.setTool('rectangle');
      });

    </script>
  </body>

</html>
